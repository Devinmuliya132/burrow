name: Bug
description: Something does not work, or does not work the way Go does
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        If burrow behaves differently from Go, that is the most useful kind of bug report this project can get, and the smallest program that shows it is worth more than a paragraph describing it.

        Please do not report a security problem here. See SECURITY.md.

  - type: input
    id: version
    attributes:
      label: Version
      description: What `burrow_version()` and `burrow_sourceid()` return, or the release you downloaded.
      placeholder: "0.0.1, 4f2a1c9"
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Platform and compiler
      placeholder: "macOS 15 arm64, clang 17"
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: A program that shows it
      description: Smallest thing that compiles and misbehaves. It will be pasted into a test.
      render: c
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected and what happened
      description: If Go does something different, the equivalent Go program and its output belongs here.
    validations:
      required: true
