# burrow has no dependencies and that is a design goal rather than an accident,
# so the only thing here to keep current is the actions the workflows call.
# Grouped into one pull request a week because five separate bumps of an action
# minor version is five review notifications for no information.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
    labels:
      - "area: ci"
